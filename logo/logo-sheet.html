<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Knotted Logo</title>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--black:#0d0d0c;--gold:#c3a36b;--ivory:#efe9df}
  *{box-sizing:border-box;margin:0}
  body{background:#222;font-family:Jost,sans-serif;color:#999;padding:24px 16px}
  h1{font:500 .75rem Jost;letter-spacing:.3em;text-transform:uppercase;color:#aaa;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;max-width:1200px;margin:0 auto}
  .tile{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
  .tile small{position:absolute;top:12px;left:14px;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
  .dark{background:var(--black);color:var(--ivory)}
  .light{background:var(--ivory);color:var(--black)}
  .gold{background:var(--gold);color:var(--black)}
  .wide{grid-column:1/-1}

  /* The mark is drawn with currentColor so it can sit on any background */
  .mark{width:var(--s,96px);height:var(--s,96px);color:var(--gold)}
  .light .mark,.gold .mark{color:var(--black)}

  .word b{display:block;font:600 var(--w,2.6rem)/1 "Cormorant Garamond",serif;letter-spacing:.06em;white-space:nowrap}
  .word span{display:flex;align-items:center;gap:12px;font:500 calc(var(--w,2.6rem)*.26)/1 Jost,sans-serif;letter-spacing:.55em;color:var(--gold);margin-top:10px;padding-left:.2em}
  .light .word span,.gold .word span{color:var(--black)}
  .word span::before,.word span::after{content:"";flex:1;height:1px;background:currentColor;opacity:.7}

  .horizontal{display:flex;align-items:center;gap:22px}
  .stacked{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
  .social{width:220px;height:220px;border-radius:50%;background:var(--black);display:grid;place-items:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gk-mark" viewBox="0 0 120 120">
    <defs><clipPath id="gk-clip"><circle cx="60" cy="60" r="47"/></clipPath></defs>
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="60" cy="60" r="56" stroke-width="1.4"/>
      <circle cx="60" cy="60" r="51.5" stroke-width=".7"/>
      <g clip-path="url(#gk-clip)" stroke-width="1.6">
        <path d="M43 0C43 35 39 40 39 60S43 85 43 120"/>
        <path d="M34 0C34 35 30 40 30 60S34 85 34 120"/>
        <path d="M25 0C25 35 22 40 22 60S25 85 25 120"/>
        <path d="M77 0C77 35 81 40 81 60S77 85 77 120"/>
        <path d="M86 0C86 35 90 40 90 60S86 85 86 120"/>
        <path d="M95 0C95 35 98 40 98 60S95 85 95 120"/>
        <path d="M60 0V38M60 82V120"/>
        <ellipse cx="60" cy="60" rx="15" ry="22"/>
        <ellipse cx="60" cy="60" rx="9.5" ry="14"/>
      </g>
      <ellipse cx="60" cy="60" rx="4.5" ry="7" fill="currentColor" stroke="none"/>
    </g>
  </symbol>
</svg>

<h1>Get Knotted Joinery · logo concepts</h1>
<div class="grid">
  <div class="tile dark wide"><small>Primary · horizontal</small>
    <div class="horizontal"><svg class="mark" style="--s:min(110px,16vw)"><use href="#gk-mark"/></svg>
      <div class="word" style="--w:min(3.4rem,6.4vw)"><b>GET KNOTTED</b><span>JOINERY</span></div></div>
  </div>
  <div class="tile dark"><small>Stacked</small>
    <div class="stacked"><svg class="mark" style="--s:120px"><use href="#gk-mark"/></svg>
      <div class="word" style="--w:2.4rem"><b>GET KNOTTED</b><span>JOINERY</span></div></div>
  </div>
  <div class="tile light"><small>On light · vans, invoices</small>
    <div class="stacked"><svg class="mark" style="--s:120px"><use href="#gk-mark"/></svg>
      <div class="word" style="--w:2.4rem"><b>GET KNOTTED</b><span>JOINERY</span></div></div>
  </div>
  <div class="tile dark"><small>Social profile picture</small>
    <div class="social"><svg class="mark" style="--s:170px"><use href="#gk-mark"/></svg></div>
  </div>
  <div class="tile gold"><small>On gold · signage</small>
    <div class="horizontal"><svg class="mark" style="--s:80px"><use href="#gk-mark"/></svg>
      <div class="word" style="--w:2rem"><b>GET KNOTTED</b><span>JOINERY</span></div></div>
  </div>
  <div class="tile dark"><small>Small sizes</small>
    <div class="horizontal" style="gap:28px">
      <svg class="mark" style="--s:64px"><use href="#gk-mark"/></svg>
      <svg class="mark" style="--s:40px"><use href="#gk-mark"/></svg>
      <svg class="mark" style="--s:24px"><use href="#gk-mark"/></svg>
    </div>
  </div>
</div>
</body>
</html>
